<hr />
<DIV id="message">Hello World !</DIV>
<hr />
<DIV id="profile_name"></DIV>
<DIV id="profile_birthday"></DIV>
<DIV id="profile_memo"></DIV>

<script>

function draw() {

    const message_element = document.getElementById("message");
    message_element.innerHTML = `処理開始`;

    const now_total_walk = Math.round(util_loadTotalWalk() * 1000) / 1000;
    message_element.innerHTML = `現在の歩いた距離　${now_total_walk}km`;

    const user_profile = util_getUserProfile();
    document.getElementById("profile_name").innerHTML = user_profile.name;
    document.getElementById("profile_birthday").innerHTML = user_profile.birth_day;

    memo = `今日は生まれてから　${user_profile.days_old}　日目。`;
    memo = memo + `生まれてから歩いた距離は　${now_total_walk}km。`;
    if (user_profile.is_birthday) {
        memo = memo + `なんと今日は誕生日なのだ。`;
    }
    document.getElementById("profile_memo").innerHTML = memo;

    message_element.innerHTML = `プロファイルの取得が終了しました`;

}

// 描画
draw();

</script>

</BODY>
</HTML>

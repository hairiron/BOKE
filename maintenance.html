<BODY>

<hr />
<DIV id="message">Hello World !</DIV>
<hr />
<DIV id="checkin_buttons"></DIV>

<script>
function togglePlace(id, checked) {
    if (checked) {
        util_checkinPlace(id);
    } else {
        util_removePlace(id);
    }
}

function displayCheckinButtons(id, name, checked) {
    
    const div = document.getElementById('checkin_buttons');

    const newButton = document.createElement('input');

    newButton.id = id;
    newButton.type = "checkbox";
    newButton.checked = checked;

    // （任意）ボタンがクリックされた時の処理を追加する
    newButton.addEventListener('change', () => {
        togglePlace(id, newButton.checked);
    });

    const label = document.createElement('label');
    label.appendChild(newButton);
    label.appendChild(document.createTextNode(`${name}`));
    // label.appendChild(document.createTextNode(`${name} (${checked})`));

    const br = document.createElement('br');

    div.appendChild(label);
    div.appendChild(br);
}


function draw() {
    util_loadCheckinPlace();

    const element = document.getElementById("message");
    element.innerHTML = `処理開始`;

        // --- 景勝地 (ターゲット) ---
    g_util_locations.forEach(loc => {
        
        element.innerHTML = `${loc.name}処理中`;

        const isDisplayBluePoint = g_util_visitedPlaces.includes(loc.id);
        if (isDisplayBluePoint) {
            //既に行ったことがあるポイントで、表示しない設定の時は次のforEach要素へ
            //    return;
        }

        displayCheckinButtons(loc.id, loc.name, isDisplayBluePoint);
        element.innerHTML = `処理終了`;
    });

    element.innerHTML = `既に行ったことのある場所にチェックをつけてください`; 
}

// 描画
draw();

</script>

</BODY>
</HTML>
